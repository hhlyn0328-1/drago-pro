<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
</head>
<body>
<title>비밀리에 스카우팅 리포트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

:root{
  --ground:#F0EEEB; --surface:#FBFAF9; --surface-2:#F4F2EF;
  --ink:#17181B; --ink-2:#484540; --muted:#7C7770;
  --line:#DEDAD4; --line-strong:#C6C0B8;
  --a:#B23A1F; --a-soft:rgba(178,58,31,.11); --a-mid:rgba(178,58,31,.22);
  --b:#1273A8; --b-soft:rgba(18,115,168,.11); --b-mid:rgba(18,115,168,.22);
  --good:#1E6B50;
  --chip-out-bg:rgba(23,24,27,.05);
  --shadow:0 1px 2px rgba(30,24,18,.05), 0 8px 24px -16px rgba(30,24,18,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121214; --surface:#1A1A1D; --surface-2:#212126;
    --ink:#ECEAE7; --ink-2:#BEB9B2; --muted:#8C8780;
    --line:#2C2C32; --line-strong:#3E3E46;
    --a:#DB5A33; --a-soft:rgba(219,90,51,.15); --a-mid:rgba(219,90,51,.30);
    --b:#3D9AD1; --b-soft:rgba(61,154,209,.15); --b-mid:rgba(61,154,209,.30);
    --good:#4FAE87;
    --chip-out-bg:rgba(236,234,231,.07);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#121214; --surface:#1A1A1D; --surface-2:#212126;
  --ink:#ECEAE7; --ink-2:#BEB9B2; --muted:#8C8780;
  --line:#2C2C32; --line-strong:#3E3E46;
  --a:#DB5A33; --a-soft:rgba(219,90,51,.15); --a-mid:rgba(219,90,51,.30);
  --b:#3D9AD1; --b-soft:rgba(61,154,209,.15); --b-mid:rgba(61,154,209,.30);
  --good:#4FAE87;
  --chip-out-bg:rgba(236,234,231,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding:clamp(20px,4vw,48px) clamp(16px,4vw,40px) 96px; display:flex; flex-direction:column; gap:clamp(28px,4vw,44px)}
h2,h3{margin:0; font-family:"Hahmlet",serif; text-wrap:balance}

/* ---------- masthead + tabs ---------- */
.mast{display:flex; flex-direction:column; gap:6px}
.mast h1{
  margin:0; font-family:"Hahmlet",serif; font-weight:900; letter-spacing:-.03em;
  font-size:clamp(24px,4.5vw,34px); line-height:1.15;
}
.mast p{margin:0; font-size:13.5px; color:var(--muted)}
.mast p .ln + .ln{margin-top:.2em}
.shead .hint .ln{display:block}
.shead .hint .ln + .ln{margin-top:.15em}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.eyebrow::before{content:""; width:26px; height:2px; background:var(--a); flex:none}

.tabs{display:flex; gap:0; overflow-x:auto; border-bottom:1px solid var(--line-strong); scrollbar-width:thin}
.tab{
  appearance:none; background:none; border:0; cursor:pointer; flex:none;
  display:flex; flex-direction:column; gap:2px; align-items:flex-start;
  padding:11px 16px 12px; border-bottom:2px solid transparent; margin-bottom:-1px;
  font-family:inherit; color:var(--muted); text-align:left; transition:color .15s, border-color .15s;
}
.tab:hover{color:var(--ink-2)}
.tab__d{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em}
.tab__o{font-size:13.5px; font-weight:600; white-space:nowrap}
.tab__s{font-family:"IBM Plex Mono",monospace; font-size:11px; display:flex; gap:5px; align-items:center}
.tab__s b{font-weight:600}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--a)}
.tab[aria-selected="true"] .tab__d{color:var(--a)}
.tab .w{color:var(--a); font-weight:600}
.tab .l{color:var(--muted); font-weight:600}
.tab--us .tab__o{color:var(--b)}
.tab--us[aria-selected="true"]{border-bottom-color:var(--b)}
.tab--us[aria-selected="true"] .tab__d{color:var(--b)}

/* ---------- head-to-head ---------- */
#h2h, #scout{display:flex; flex-direction:column; gap:16px}
#logsec{gap:16px}
#logsec .tabs{margin-bottom:8px}
.h2h{
  background:var(--surface); border:1px solid var(--line); border-radius:3px;
  box-shadow:var(--shadow); border-left:3px solid var(--a); overflow:hidden;
}
.h2h__top{display:flex; flex-wrap:wrap; gap:clamp(14px,3vw,30px); align-items:center; padding:clamp(18px,3.5vw,28px)}
.h2h__score{display:flex; align-items:baseline; gap:12px; font-family:"Hahmlet",serif; letter-spacing:-.03em}
.h2h__score b{font-size:clamp(38px,7vw,58px); font-weight:900; line-height:.9}
.h2h__score .them{color:var(--a)}
.h2h__score .us{color:var(--ink-2)}
.h2h__score span{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--muted); letter-spacing:.1em}
.h2h__who{display:flex; flex-direction:column; gap:3px; min-width:0}
.h2h__who .t{font-size:13.5px; font-weight:600}
.h2h__who .t.them{color:var(--a)}
.h2h__who .d{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); letter-spacing:.06em}
.h2h__mini{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
.h2h__inn{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:34px}
.h2h__inn i{font-family:"IBM Plex Mono",monospace; font-style:normal; font-size:10px; color:var(--muted); letter-spacing:.08em}
.h2h__inn b{font-family:"IBM Plex Mono",monospace; font-size:14px; font-weight:600; color:var(--a)}
.h2h__inn u{font-family:"IBM Plex Mono",monospace; font-size:13px; text-decoration:none; color:var(--ink-2)}
.h2h__facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:0; border-top:1px dashed var(--line-strong)}
.h2h__fact{padding:16px clamp(16px,3vw,26px); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:4px}
.h2h__fact:last-child{border-right:0}
.h2h__fact b{font-family:"Hahmlet",serif; font-size:20px; font-weight:700; color:var(--a)}
.h2h__fact span{font-size:12.5px; color:var(--ink-2); line-height:1.55}
.h2h__fact em{display:block; font-style:normal; font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase}

/* ---------- scouting ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px}
.kpi{padding:18px 20px; display:flex; flex-direction:column; gap:5px; border-top:3px solid var(--a)}
.kpi b{font-family:"Hahmlet",serif; font-size:30px; font-weight:900; letter-spacing:-.03em; line-height:1}
.kpi .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.kpi .d{font-size:12.5px; color:var(--ink-2); line-height:1.55}

.threats{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.threat{padding:18px 20px; display:flex; flex-direction:column; gap:9px}
.threat--1{border-left:3px solid var(--a)}
.threat--2{border-left:3px solid var(--b)}
.threat--3{border-left:3px solid var(--line-strong)}
.threat__hd{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.threat__hd b{font-family:"Hahmlet",serif; font-size:19px; font-weight:700; letter-spacing:-.01em}
.threat__hd i{font-style:normal; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}
.tier{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.12em; font-weight:600;
  padding:2px 7px; border-radius:2px; margin-left:auto; white-space:nowrap;
}
.tier--1{background:var(--a); color:#fff}
.tier--2{background:var(--b-soft); color:var(--b)}
.tier--3{background:var(--chip-out-bg); color:var(--muted)}
.threat__line{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; line-height:1.7}
.threat__line b{color:var(--ink); font-weight:600}
.threat__how{font-size:13.5px; line-height:1.65; color:var(--ink-2)}
.threat__how strong{color:var(--ink); font-weight:600}

.plan{display:flex; flex-direction:column; gap:0; padding:0}
.plan__row{display:grid; grid-template-columns:34px 1fr; gap:14px; padding:16px clamp(16px,3vw,24px); border-bottom:1px solid var(--line); align-items:start}
.plan__row:last-child{border-bottom:0}
.plan__n{font-family:"Hahmlet",serif; font-weight:900; font-size:22px; color:var(--a); line-height:1; letter-spacing:-.03em}
.plan__t{font-weight:600; font-size:14.5px; margin-bottom:3px}
.plan__d{font-size:13.5px; color:var(--ink-2); line-height:1.65}
.plan__d b{color:var(--ink); font-weight:600}

table.agg{border-collapse:collapse; width:100%; min-width:720px; font-size:13px}
table.agg th,table.agg td{border-bottom:1px solid var(--line); padding:8px 10px}
table.agg thead th{
  background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:11px;
  letter-spacing:.06em; color:var(--muted); text-align:center; border-bottom:1px solid var(--line-strong);
}
table.agg td{text-align:center; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
table.agg td.who{text-align:left; font-family:inherit; white-space:nowrap}
table.agg td.who b{font-weight:600}
table.agg td.who i{font-style:normal; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); margin-left:5px}
table.agg td.pos{text-align:left; font-family:inherit; color:var(--muted); font-size:12px; white-space:nowrap}
table.agg tbody tr:hover{background:var(--surface-2)}
table.agg tr.hot td{background:var(--a-soft)}
table.agg tr.hot td.who b{color:var(--a)}
table.agg td.lead{font-weight:600; color:var(--ink)}

/* ---------- board ---------- */
#game{display:flex; flex-direction:column; gap:clamp(28px,4.5vw,52px)}
.gtour{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
  letter-spacing:.12em; color:var(--muted); margin-bottom:-16px;
}
.board{background:var(--surface); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow); overflow:hidden}
.board__top{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:clamp(8px,3vw,32px); padding:clamp(22px,4vw,34px) clamp(16px,4vw,34px);
  border-bottom:1px dashed var(--line-strong);
}
.side{display:flex; flex-direction:column; gap:6px; min-width:0}
.side--b{text-align:right; align-items:flex-end}
.side__name{font-family:"Hahmlet",serif; font-weight:700; font-size:clamp(15px,2.4vw,21px); line-height:1.25; letter-spacing:-.01em}
.side--a .side__name{color:var(--a)} .side--b .side__name{color:var(--b)}
.side__score{font-family:"Hahmlet",serif; font-weight:900; font-size:clamp(52px,11vw,92px); line-height:.9; letter-spacing:-.04em}
.side__note{font-size:12.5px; color:var(--muted)}
.side__note b{color:var(--ink-2); font-weight:600}
.result{
  display:inline-flex; align-items:center; gap:5px; font-family:"IBM Plex Mono",monospace;
  font-size:11px; letter-spacing:.12em; font-weight:600; padding:2px 8px; border-radius:2px;
}
.result--w{background:var(--a-soft); color:var(--a)}
.result--l{background:var(--chip-out-bg); color:var(--muted)}
.side--a .result{align-self:flex-start}
.side--b .result{align-self:flex-end}
.divider{display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--muted)}
.divider__rule{width:1px; height:clamp(40px,9vw,68px); background:var(--line-strong)}
.divider__txt{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.18em}

.linescore{overflow-x:auto}
.linescore table{border-collapse:collapse; width:100%; min-width:560px}
.linescore th,.linescore td{padding:9px 6px; text-align:center; font-size:13.5px; border-bottom:1px solid var(--line)}
.linescore thead th{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:500; background:var(--surface-2)}
.linescore tbody tr:last-child td{border-bottom:none}
.linescore .lteam{text-align:left; padding-left:clamp(14px,3vw,30px); font-weight:600; white-space:nowrap; min-width:150px}
.linescore .lteam span{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:8px; vertical-align:2px}
.linescore .runs{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.linescore .big{background:var(--a-mid); font-weight:600; border-radius:2px}
.linescore .big--b{background:var(--b-mid)}
.linescore .tot{font-family:"IBM Plex Mono",monospace; font-weight:600; background:var(--surface-2)}
.linescore .tot--r{font-size:16px}
.sepl{border-left:1px solid var(--line-strong)}

.lede{
  margin:0; font-family:"Hahmlet",serif; font-size:clamp(19px,3vw,26px); line-height:1.55;
  font-weight:500; letter-spacing:-.015em; max-width:32ch;
}
.lede em{font-style:normal; color:var(--a); font-weight:700}
.lede .sub{display:block; margin-top:10px; font-family:"IBM Plex Sans KR",sans-serif; font-size:14.5px; font-weight:400; color:var(--ink-2); line-height:1.7; max-width:58ch}

/* ---------- sections ---------- */
section{display:flex; flex-direction:column; gap:16px}
.shead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line-strong); padding-bottom:10px}
.shead h2{font-size:clamp(17px,2.6vw,21px); font-weight:700; letter-spacing:-.01em}
.shead .hint{font-size:12.5px; color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow)}

/* ---------- inning chart ---------- */
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{width:11px; height:11px; border-radius:2px; display:block}
.innings{display:grid; gap:clamp(8px,2.5vw,22px); padding:clamp(16px,3vw,26px)}
.inn{display:flex; flex-direction:column; gap:10px; min-width:0}
.inn__plot{display:flex; align-items:flex-end; justify-content:center; gap:6px; height:150px; border-bottom:1px solid var(--line-strong)}
.bar{width:clamp(18px,4vw,34px); border-radius:4px 4px 0 0; position:relative; display:flex; justify-content:center; transition:filter .15s}
.bar:hover{filter:brightness(1.12)}
.bar--a{background:var(--a)} .bar--b{background:var(--b)}
.bar--zero{height:2px !important; border-radius:1px; opacity:.35}
.bar__val{position:absolute; top:-21px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.inn__foot{display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center}
.inn__no{font-family:"Hahmlet",serif; font-weight:700; font-size:15px}
.inn__cum{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted)}
.inn--key-a .inn__no{color:var(--a)}
.inn--key-b .inn__no{color:var(--b)}
.inn__badge{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em; color:var(--a); background:var(--a-soft); padding:1px 6px; border-radius:2px; margin-top:3px}
.inn--key-b .inn__badge{color:var(--b); background:var(--b-soft)}
.bar--none{width:clamp(18px,4vw,34px); height:2px; background:transparent}
.bar--none .bar__val{color:var(--line-strong)}

/* ---------- compare ---------- */
.compare{display:flex; flex-direction:column; padding:clamp(14px,3vw,24px)}
.crow{display:grid; grid-template-columns:40px 1fr 84px 1fr 40px; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.ctrack{display:flex; align-items:center; min-width:0}
.ctrack--a{justify-content:flex-end}
.cbar{height:11px; flex:none}
.cbar--a{background:var(--a); border-radius:2px 0 0 2px}
.cbar--b{background:var(--b); border-radius:0 2px 2px 0}
.cbar--zero{width:0 !important}
.cval{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600; color:var(--ink-2)}
.cval--a{text-align:right}
.clabel{text-align:center; font-size:12.5px; color:var(--muted); letter-spacing:.02em}
.crow--hi .clabel{color:var(--ink); font-weight:600}
.crow--hi .cval{color:var(--ink)}
.crow--nobar{border-top:1px solid var(--line); margin-top:2px}
.crow--nobar .cval{color:var(--muted)}
.caxis{display:grid; grid-template-columns:40px 1fr 84px 1fr 40px; gap:8px; padding-top:8px; margin-top:4px; border-top:1px solid var(--line)}
.caxis__side{display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted)}

/* ---------- highlights ---------- */
.hl{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
.hlcard{padding:20px 22px; display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--a)}
.hlcard__k{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.hlcard__n{font-family:"Hahmlet",serif; font-size:22px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.hlcard__n small{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0}
.hlcard__d{font-size:13.5px; color:var(--ink-2); line-height:1.6}
.hlcard__stat{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--a); font-weight:600}

/* ---------- record tables ---------- */
.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.rec{border-collapse:collapse; width:100%; min-width:880px; font-size:13px}
table.rec th,table.rec td{border-bottom:1px solid var(--line); padding:8px; vertical-align:top}
table.rec thead th{
  background:var(--surface-2);
  font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:11px; letter-spacing:.06em;
  color:var(--muted); text-align:center; padding:10px 8px; border-bottom:1px solid var(--line-strong);
}
table.rec thead th.tot{color:var(--ink-2); font-weight:600}
table.rec td.c{text-align:center}
table.rec td.num{text-align:center; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
table.rec td.ord{font-family:"Hahmlet",serif; font-weight:700; font-size:14px; text-align:center; color:var(--muted)}
table.rec td.who{white-space:nowrap}
table.rec td.who b{font-weight:600}
table.rec td.who i{font-style:normal; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); margin-left:5px}
table.rec td.pos{color:var(--muted); font-size:12px; white-space:nowrap}
table.rec tr.sub td{border-top:0}
table.rec tr.sub td.who::before{content:"↳"; color:var(--muted); margin-right:5px}
table.rec tbody tr:hover{background:var(--surface-2)}
table.rec td.avg{font-family:"IBM Plex Mono",monospace; text-align:center; font-weight:600}
table.rec .grp{border-left:1px solid var(--line-strong)}
tr.win td.res{color:var(--a); font-weight:600}

.cell{display:flex; flex-direction:column; gap:3px; align-items:flex-start; min-width:74px}
.chip{font-size:11.5px; line-height:1.5; padding:1px 6px; border-radius:2px; white-space:nowrap; font-weight:500}
.chip--hit{background:var(--a); color:#fff}
.chip--hr{background:var(--a); color:#fff; box-shadow:0 0 0 2px var(--a-mid)}
.chip--on{background:transparent; color:var(--a); box-shadow:inset 0 0 0 1px var(--a-mid)}
.chip--out{background:var(--chip-out-bg); color:var(--muted)}
.chip--run{background:var(--b-soft); color:var(--b); font-family:"IBM Plex Mono",monospace; font-size:11px}
.chip--sb{background:transparent; color:var(--good); box-shadow:inset 0 0 0 1px currentColor; font-size:10.5px; letter-spacing:.02em}
.chip--etc{background:transparent; color:var(--muted); font-size:10.5px; padding-left:0}

  var PROSE_SEL = ".lede .sub, .threat__how, .plan__d, .hlcard__d, .kpi .d, .h2h__fact span, .note__v, .shead .hint";
  function tagsBalanced(s){
    var ok = true;
    ["b", "strong", "em", "i", "span"].forEach(function(t){
      var o = (s.match(new RegExp("<" + t + "[ >]", "g")) || []).length;
      var c = (s.match(new RegExp("</" + t + ">", "g")) || []).length;
      if (o !== c) ok = false;
    });
    return ok;
  }
  function splitLines(h){
    var out = [], cur = "", depth = 0;
    for (var i = 0; i < h.length; i++){
      var c = h.charAt(i);
      if (c === "<") depth++;
      if (c === ">") depth--;
      cur += c;
      var end = (c === "." || c === "!" || c === "?");
      var nextWs = (i + 1 >= h.length) || /\s/.test(h.charAt(i + 1));
      if (depth <= 0 && end && nextWs && tagsBalanced(cur) && cur.trim().length > 6){
        out.push(cur.trim()); cur = ""; i++;
      }
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  }
  function proseify(scope){
    var nodes = (scope || document).querySelectorAll(PROSE_SEL);
    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      if (n.getAttribute("data-prosed")) continue;
      n.setAttribute("data-prosed", "1");
      var lines = splitLines(n.innerHTML);
      if (lines.length < 2) continue;
      n.innerHTML = lines.map(function(s){ return '<span class="ln">' + s + "</span>"; }).join("");
    }
  }

    var ks = Object.keys(b.pos).sort(function(x, y){ return b.pos[y] - b.pos[x]; });
    if (ks.length > 1 && b.pos[ks[1]] >= 2) return ks[0] + "·" + ks[1] + (ks.length > 2 ? " 등" : "");

  function aggregate(){
    var B = {}, P = {}, team = {sb:0, bb:0, e:0, ab:0, h:0, r:0, ra:0, w:0, l:0, pbb:0, pouts:0, pe:0};
    GAMES.forEach(function(g){
      g.lineup.forEach(function(p){
        var k = p.name + "#" + p.no;
        B[k] = B[k] || {name:p.name, no:p.no, g:0, pa:0, ab:0, h:0, rbi:0, r:0, sb:0, xbh:0, hr:0, bbh:0, so:0, pos:{}};
        var b = B[k]; b.g++;
        b.pa += +p.s[0]; b.ab += +p.s[1]; b.h += +p.s[2];
        b.rbi += +p.s[3]; b.r += +p.s[4]; b.sb += +p.s[5];
        b.pos[p.pos] = (b.pos[p.pos] || 0) + 1;
        p.ip.forEach(function(ev){ ev.forEach(function(t){
          if (/홈$/.test(t)) { b.hr++; b.xbh++; }
          else if (/[23]$/.test(t) && !/타점|득점/.test(t)) b.xbh++;
          if (t === "볼넷(4구)" || t === "사구") b.bbh++;
          if (t === "삼진" || t === "낫아웃") b.so++;
        }); });
      });
      g.pitchers.forEach(function(p){
        P[p.name] = P[p.name] || {name:p.name, g:0, o:0, np:0, bf:0, h:0, bb:0, hbp:0, k:0, wp:0, r:0, er:0, w:0, l:0};
        var q = P[p.name]; q.g++;
        q.np += p.p[0]; q.o += outs(p.p[1]); q.bf += p.p[2]; q.h += p.p[4];
        q.bb += p.p[6]; q.hbp += p.p[7]; q.k += p.p[8]; q.wp += p.p[9];
        q.r += p.p[10]; q.er += p.p[11];
        if (p.res === "승") q.w++;
        if (p.res === "패") q.l++;
        team.pbb += p.p[6] + p.p[7]; team.pouts += outs(p.p[1]);
      });
      g.compare.forEach(function(c){
        if (c.k === "도루") team.sb += c.a;
        if (c.k === "사사구") team.bb += c.a;
        if (c.k === "실책") { team.e += c.a; team.pe += c.b; }
      });
      team.h += g.tot.a.h; team.r += g.tot.a.r; team.ra += g.tot.b.r;
      if (g.tot.a.r > g.tot.b.r) team.w++; else team.l++;
      g.lineup.forEach(function(p){ team.ab += +p.s[1]; });
    });
    return {
      batters: Object.keys(B).map(function(k){ return B[k]; }).sort(function(x, y){ return y.h - x.h || y.r - x.r; }),
      pitchers: Object.keys(P).map(function(k){ return P[k]; }).sort(function(x, y){ return y.o - x.o; }),
      team: team
    };
  }

      var n = PIT_NOTES[q.name];
      if (!n) return;
      var c = el("div", "card threat threat--" + n.tier);
      var hd = el("div", "threat__hd");
      hd.appendChild(el("b", null, q.name));
      hd.appendChild(el("i", null, q.w + "승 " + q.l + "패 · " + q.g + "경기"));
      hd.appendChild(el("span", "tier tier--" + n.tier, n.label));
      c.appendChild(hd);
      var ip = q.o / 3;
      var ln = el("div", "threat__line");
      ln.innerHTML = "<b>" + ipStr(q.o) + "이닝</b> · 피안타 " + q.h + " · 사사구 " + (q.bb + q.hbp) +
        " · 탈삼진 " + q.k + "<br>실점 " + q.r + " (자책 " + q.er + ") · ERA <b>" + (q.er * 9 / ip).toFixed(2) + "</b>" +
        " · 9이닝당 사사구 " + ((q.bb + q.hbp) * 9 / ip).toFixed(1);
      c.appendChild(ln);
      var how = el("div", "threat__how"); how.innerHTML = n.how;
      c.appendChild(how);
      pg.appendChild(c);
    });
    s3.appendChild(pg);

    var t3 = el("div", "card scroller");
    var ptbl = el("table", "agg");
    var pth = el("thead"), ptr = el("tr");
    ["선수", "등판", "승-패", "이닝", "투구수", "피안타", "볼넷", "사구", "삼진", "폭투", "실점", "자책", "ERA"].forEach(function(h, i){
      var e = el("th", null, h); e.setAttribute("scope", "col");
      if (i === 0) e.style.textAlign = "left";
      ptr.appendChild(e);
    });
    pth.appendChild(ptr); ptbl.appendChild(pth);
    var ptb = el("tbody");
    AGG.pitchers.forEach(function(q){
      var tr = el("tr", PIT_NOTES[q.name] && PIT_NOTES[q.name].tier === 1 ? "hot" : "");
      var w = el("td", "who"); w.appendChild(el("b", null, q.name));
      tr.appendChild(w);
      tr.appendChild(el("td", null, String(q.g)));
      tr.appendChild(el("td", null, q.w + "-" + q.l));
      tr.appendChild(el("td", "lead", ipStr(q.o)));
      [q.np, q.h, q.bb, q.hbp, q.k, q.wp, q.r, q.er].forEach(function(v){ tr.appendChild(el("td", null, String(v))); });
      tr.appendChild(el("td", "lead", q.o ? (q.er * 9 / (q.o / 3)).toFixed(2) : "–"));
      ptb.appendChild(tr);
    });
    ptbl.appendChild(ptb);
    t3.appendChild(ptbl);
    s3.appendChild(t3);
    host.appendChild(s3);
  }

  /* ---------- tabs ---------- */
  function buildTabs(){
    var host = document.getElementById("tabs");
    GAMES.forEach(function(g, i){
      var won = g.tot.a.r > g.tot.b.r;
      var b = el("button", "tab" + (g.vsUs ? " tab--us" : ""));
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", "false");
      b.id = "tab-" + g.id;
      var md = g.date.slice(5).replace("-", "/").replace(/^0/, "");
      b.appendChild(el("span", "tab__d", md + " (" + g.dow + ")"));
      b.appendChild(el("span", "tab__o", g.vsUs ? "vs 우리 (드래곤볼)" : "vs " + g.opp));
      var sc = el("span", "tab__s");
      sc.appendChild(el("b", won ? "w" : "l", won ? "승" : "패"));
      sc.appendChild(document.createTextNode(g.tot.a.r + "-" + g.tot.b.r));
      b.appendChild(sc);
      b.addEventListener("click", function(){ select(i, true); });
      b.addEventListener("keydown", function(e){
        if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
          e.preventDefault();
          select((i + (e.key === "ArrowRight" ? 1 : GAMES.length - 1)) % GAMES.length, true, true);
        }
      });
      host.appendChild(b);
    });
  }

  function select(i, push, focus){
    var tabs = document.querySelectorAll(".tab");
    for (var k = 0; k < tabs.length; k++){
      tabs[k].setAttribute("aria-selected", k === i ? "true" : "false");
      tabs[k].tabIndex = k === i ? 0 : -1;
    }
    if (focus) tabs[i].focus();
    renderGame(GAMES[i]);
    if (push && history.replaceState) history.replaceState(null, "", "#" + GAMES[i].id);
    tip.style.opacity = "0";
  }

  function summary(){
    var w = 0, l = 0, rf = 0, ra = 0;
    GAMES.forEach(function(g){
      if (g.tot.a.r > g.tot.b.r) w++; else l++;
      rf += g.tot.a.r; ra += g.tot.b.r;
    });
    document.getElementById("record").innerHTML =
      '<span class="ln">서울송파구비밀리에 · 2026 시즌 ' + GAMES.length + "경기</span>" +
      '<span class="ln">' + w + "승 " + l + "패 · 득점 " + rf + " / 실점 " + ra + "</span>";
  }

  renderH2H();
  renderScout();
  proseify(document.getElementById("h2h"));
  proseify(document.getElementById("scout"));
  buildTabs();
  summary();
  var start = 0;
  var h = (location.hash || "").replace("#", "");
  GAMES.forEach(function(g, i){ if (g.id === h) start = i; });
  select(start, false);
})();
</script>

</body>
</html>
